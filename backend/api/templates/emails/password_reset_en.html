<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f5; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .btn { display: block; background-color: #10b981; color: white !important; text-decoration: none; padding: 12px; text-align: center; border-radius: 6px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #10b981; text-align: center;">Password Recovery</h2>
        <p>Hello {{ user.username }},</p>
        <p>We received a request to reset your RefurbTrack password.</p>
        <p>If this was you, click the button below:</p>
        
        <a href="{{ reset_link }}" class="btn">Reset Password</a>
        
        <p style="font-size: 12px; color: #666;">If you didn't request this, you can safely ignore this email.</p>
    </div>
</body>
</html>
