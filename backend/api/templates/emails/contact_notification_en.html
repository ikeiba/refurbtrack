<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .field { margin-bottom: 12px; }
        .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 14px; color: #333; }
        .message { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-top: 16px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #10b981;">New contact message</h2>

        <div class="field">
            <div class="label">Name</div>
            <div class="value">{{ name }}</div>
        </div>

        <div class="field">
            <div class="label">Email</div>
            <div class="value">{{ email }}</div>
        </div>

        <div class="field">
            <div class="label">Subject</div>
            <div class="value">{{ subject }}</div>
        </div>

        <div class="message">{{ message }}</div>
    </div>
</body>
</html>
