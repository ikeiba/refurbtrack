services:
  # 1. BASE DE DATOS (PostgreSQL)
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. REDIS (Cola de mensajes)
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - app-network

  # 3. BACKEND (Django API)
  web:
    build: .
    env_file:
      - .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: always
    volumes:
      # Montamos el código para no tener que reconstruir si cambias algo pequeño (opcional en prod)
      - ./backend:/app/backend
      - ./scraper:/app/scraper
      - static_volume:/app/backend/staticfiles
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - db
      - redis
    networks:
      - app-network
    ports:
      - "127.0.0.1:8000:8000"

  # 4. CELERY WORKER (Ejecuta el scraper)
  celery_worker:
    build: .
    # OJO: Aquí le decimos que arranque el worker en vez de gunicorn
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./scraper:/app/scraper
    command: celery -A config worker --loglevel=info --concurrency=2
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - db
      - redis
      - web
    networks:
      - app-network

  # 5. CELERY BEAT (El reloj)
  celery_beat:
    build: .
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./scraper:/app/scraper
    command: celery -A config beat --loglevel=info
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - redis
      - web
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:

networks:
  app-network:
    driver: bridge