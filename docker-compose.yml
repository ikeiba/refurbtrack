services:
  # 1. BASE DE DATOS (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. REDIS (Cola de mensajes)
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. BACKEND (Django API)
  web:
    build: .
    container_name: django_backend
    env_file:
      - .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    restart: unless-stopped
    volumes:
      # Montamos el código para no tener que reconstruir si cambias algo pequeño (opcional en prod)
      - ./backend:/app/backend
      - ./scraper:/app/scraper
      - static_volume:/app/backend/staticfiles
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID} # <-- AÑADE ESTA LÍNEA
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    #ports:
    #- "127.0.0.1:8000:8000"  # ELIMINAR EN PRODUCCION, SOLO PARA DESARROLLO (EN PROD NGINX SE ENCARGA DE EXPONERLO)
    healthcheck:  # 👈 AÑADIR TODO ESTO
        test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health/ || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
    # ports:
    #  - "127.0.0.1:8000:8000"

  # 4. CELERY WORKER (Ejecuta el scraper)
  celery_worker:
    build: .
    container_name: celery_worker
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./scraper:/app/scraper
    command: celery -A config worker --loglevel=info --concurrency=2
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app-network

  # 5. CELERY BEAT (El reloj)
  celery_beat:
    build: .
    container_name: celery_beat
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./scraper:/app/scraper
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app-network
  
  # 6. FLOWER (Monitor de Celery)
  flower:
    image: mher/flower
    container_name: celery_flower
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    # Le decimos a Flower que va a vivir detrás de este endpoint específico
    command: celery flower --url_prefix=/monitor-flower
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - app-network

# ========================================
# FRONTEND (Next.js)
# ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api  # ← Configurable aquí
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: nextjs_frontend
    restart: unless-stopped
    networks:
      - app-network
    environment:
      # Para el navegador (client-side) - ruta relativa
      # Para SSR (server-side) - URL interna
      - INTERNAL_API_URL=http://web:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/es', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
# ========================================
# NGINX (Proxy Inverso)
# ========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"  # ✅ ÚNICO puerto expuesto a internet
      - "443:443"  # Descomentar cuando configures SSL
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  static_volume:

networks:
  app-network:
    driver: bridge