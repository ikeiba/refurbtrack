# ========================================
# RATE LIMITING ZONES
# ========================================
# Zona general: 10 peticiones por segundo
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Zona de autenticación: 5 peticiones por minuto (muy restrictivo)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

# ========================================
# UPSTREAM BACKENDS
# ========================================
upstream django_backend {
    server web:8000;
}

upstream nextjs_frontend {
    server frontend:3000;
}

upstream flower_backend {
    server flower:5555;
}

# ========================================
# SERVER BLOCK
# ========================================
server {
    listen 80;
    server_name _;  # Cambia por tu dominio en producción
    
    # Tamaño máximo de archivos (para subir imágenes, etc.)
    client_max_body_size 20M;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ========================================
    # HEALTHCHECK ENDPOINT (para load balancers)
    # ========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================
    # API AUTENTICACIÓN (MUY LIMITADO)
    # ========================================
    location /api/auth/ {
        # Solo 5 peticiones por minuto por IP
        # burst=10 permite un pequeño burst temporal
        limit_req zone=api_auth burst=10 nodelay;
        
        # Si excede el límite, devuelve 429 Too Many Requests
        limit_req_status 429;
        
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ========================================
    # API GENERAL (LIMITADO)
    # ========================================
    location /api/ {
        # 10 peticiones por segundo por IP
        # burst=20 permite picos temporales
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts más largos para operaciones complejas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================
    # ARCHIVOS ESTÁTICOS (CSS del admin de Django)
    # ========================================
    location /static/ {
        alias /var/www/static/;
        
        # Cache agresivo (7 días)
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # Desactivar logs para archivos estáticos
        access_log off;
    }

    # ========================================
    # FRONTEND (Next.js) - TODO LO DEMÁS
    # ========================================
    location / {
        proxy_pass http://nextjs_frontend;
        
        # Soporte para WebSockets (Hot Module Replacement en desarrollo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers estándar
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================
    # PANEL DE ADMINISTRACION (admin/)
    # ========================================
    location /07022019-manage/ {
        # Allow only your home/work IP
        allow 100.70.250.64;
        deny all;  # Everyone else gets 403

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================
    # PANEL DE MONITORIZACION CELERY (Flower)
    # ========================================
    location /monitor-flower/ {
        # Allow only your home/work IP (Tailscale)
        allow 100.70.250.64; # Sustituye por tu IP real
        allow 127.0.0.1;       # Permitir localhost (Windows)
        allow 172.16.0.0/12;   # Permitir la red interna de Docker
        deny all;

        proxy_pass http://flower_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Soporte CRÍTICO para WebSockets (Flower lo necesita para el tiempo real)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; # Evita que se corten los websockets en sesiones largas
    }
}